services:
  repair:
    image: ghcr.io/pukabyte/repair:latest
    # Uncomment to build locally instead of pulling from GHCR:
    # build: .
    container_name: repair
    environment:
      # Tells the script where to bootstrap / read .env + arrs.json.
      REPAIR_CONFIG_DIR: /config
    volumes:
      # Persistent config. Populate it on the host before starting:
      #   cp .env.example config/.env && cp arrs.json.example config/arrs.json
      # then fill in api keys / paths.
      - ./config:/config
      # Symlink tree the arrs see. Must match REPAIR_MEDIA_LINKS_ROOT and
      # the arrs' rootfolder paths exactly (lookup is by full path).
      - /mnt/medialinks:/mnt/medialinks:ro
      # FUSE mount must be exposed with rslave so the container sees changes
      # to the host mount (decypharr restart, remount, etc).
      - /mnt/remote/realdebrid:/mnt/remote/realdebrid:ro,rslave
    # Join the saltbox docker network so http://radarr:7878 etc resolve. Swap
    # in extra_hosts: { radarr: <ip>, ... } if you're not on saltbox.
    networks:
      - saltbox
    restart: "no"

networks:
  saltbox:
    external: true
